[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireledger"
version = "0.1.0"
description = "A research CLI for signed TLS observation histories"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<50"]

[project.scripts]
wireledger = "wireledger.__main__:main"

[tool.setuptools]
packages = ["wireledger"]

[tool.setuptools.package-data]
wireledger = ["ui/*.html", "ui/*.css", "ui/*.js"]
